.pg.feather-profile .cover{background:linear-gradient(120deg,rgba(0,132,255,.24),rgba(0,8,25,.20)),rgba(1,10,25,.30);border-color:#1bcaff70;box-shadow:0 0 28px #008cff22 inset,0 0 20px #008cff22}
.pg.feather-profile .stats,.pg.feather-profile .pa,.pg.feather-profile .ef,.pg.feather-notif .nl,.pg.feather-notif>.b{background:rgba(2,13,29,.72);backdrop-filter:blur(7px);border-color:#149bdf70}
.pg.feather-profile .pav{box-shadow:0 0 22px #00bfff99;border-color:#43dfff}
.pg.feather-profile .pn,.pg.feather-notif .ph h2{text-shadow:0 0 16px #00aaff70}
.pg.feather-profile .b,.pg.feather-notif .b{box-shadow:0 0 12px #008cff24}
.card .vcontrols{position:absolute;z-index:2;top:calc(70px + env(safe-area-inset-top,0px));inset-inline-start:12px;display:flex;gap:10px}
.card .vcontrols button{width:36px;height:36px;border-radius:50%;border:1px solid #5adfff88;background:#03172bd9;color:#fff;font-size:16px;display:grid;place-items:center;box-shadow:0 0 12px #00aaff44;backdrop-filter:blur(8px)}
.card .vcontrols button:active{transform:scale(.96)}
#dPost input[type=file]{display:block;width:100%;padding:10px;border:1px solid #1b4a66;border-radius:10px;background:#061827;color:#d8f5ff}
.file-picker-accessible{display:block!important;position:static!important;width:100%!important;height:auto!important;min-height:42px!important;opacity:1!important;clip-path:none!important;overflow:visible!important;white-space:normal!important;margin:8px 0!important;padding:10px!important;border:1px solid #168dca!important;border-radius:10px!important;background:#061827!important;color:#d8f5ff!important}


/* Reliable native file selection and visible media previews */
.profile-file-input{display:block!important;position:static!important;visibility:visible!important;opacity:1!important;width:100%!important;height:auto!important;min-height:44px!important;clip:auto!important;overflow:visible!important;margin:8px 0!important;padding:10px!important;border:1px solid #168dca!important;border-radius:12px!important;background:#061827!important;color:#d8f5ff!important}
.profile-image-picker{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px;margin:8px 0;background:#06172a;border:1px solid #168dca88;border-radius:16px}
.profile-image-picker .edit-preview{margin:0 auto 6px;width:94px;height:94px;object-fit:cover;border-radius:50%;}
.profile-image-picker button{width:100%}
.profile-status{font-size:13px;line-height:1.7;color:#7fe3ff;overflow-wrap:anywhere;padding:6px 2px}
.media-preview{margin:8px 0;padding:8px;border:1px solid #168dca88;border-radius:12px;background:#06172a;color:#d8f5ff;font-size:12px;overflow-wrap:anywhere}
.media-preview img,.media-preview video{display:block;width:100%;max-height:240px;object-fit:contain;border-radius:8px;margin-bottom:6px;background:#000}
#dPost input[type=file]{display:block;min-height:46px;cursor:pointer}


/* Mobile file picker reliability: use the native input/label directly, never a scripted click only. */
.profile-image-picker,.profile-image-picker *{pointer-events:auto!important}
.profile-image-picker{position:relative;z-index:8;display:flex;flex-direction:column;gap:8px}
.profile-file-input{display:block!important;position:relative!important;z-index:9!important;visibility:visible!important;opacity:1!important;width:100%!important;height:auto!important;min-height:54px!important;clip:auto!important;overflow:visible!important;pointer-events:auto!important;touch-action:manipulation!important;margin:8px 0!important;padding:12px!important;border:1px solid #168dca!important;border-radius:12px!important;background:#061827!important;color:#d8f5ff!important}
.profile-choose-label,.post-file-label{display:block!important;position:relative;z-index:8;pointer-events:auto!important;touch-action:manipulation!important;text-align:center;padding:14px 10px!important;border-radius:12px;background:#0b2a40;color:#d9f6ff;font-weight:700}
#dPost input[type=file]{display:block!important;position:relative!important;z-index:8!important;pointer-events:auto!important;touch-action:manipulation!important;min-height:54px;width:100%;padding:12px;border:1px solid #1b4a66;border-radius:10px;background:#061827;color:#d8f5ff}
.pg{pointer-events:auto}


/* Kalimat interaction rail: classic like/comment/share/save stack */
.side{gap:22px!important;bottom:calc(94px + env(safe-area-inset-bottom,0px))!important;z-index:4}
.side .ib{min-width:54px;min-height:54px;padding:2px 0!important;gap:4px!important;color:#f5fbff!important;background:transparent!important;border:0!important}
.side .ib .ic{display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;color:#f5fbff;filter:drop-shadow(0 2px 5px #000)}
.side .ib .ic svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.side .ib small{font-size:12px!important;font-weight:500;color:#d6edff;text-shadow:0 2px 6px #000}
.side .lk.on .ic{color:#ff4778!important;text-shadow:0 0 13px #ff4778}
.side .save-action .ic svg{fill:transparent;stroke:currentColor;stroke-width:1.8}
.side .save-action.on .ic svg{fill:#27d6ff;stroke:#27d6ff}
.side .save-action.on .ic,.side .save-action.on small{color:#27d6ff!important}
.side .fb{min-width:26px;min-height:26px;border-radius:50%;border:1px solid #31cfff;background:#082b42;color:#5fe2ff;font-size:20px;box-shadow:0 0 10px #008acb}
.ca{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:7px}
.ca button{background:rgba(2,18,32,.5);border:1px solid rgba(53,216,255,.18);border-radius:14px;color:#b9d8e8;font:inherit;font-size:12px;padding:5px 9px;cursor:pointer}
.ca button.on{color:#ff4778;border-color:#ff4778;background:rgba(255,71,120,.1)}
.cm.rp{margin-inline-start:18px;border-inline-start:2px solid #168fbd;background:rgba(5,31,48,.92)}
#dCom #cl{max-height:52vh;overflow-y:auto;overscroll-behavior:contain}
#dCom #ci{width:100%;box-sizing:border-box;background:#031523;color:#effaff;border:1px solid #14658c;border-radius:14px;padding:12px;font:inherit}
#dCom #cs{width:100%;margin-top:6px}
#rb{display:block;width:100%;text-align:right;background:#0b2a40;color:#54ddff;border:1px solid #155678;border-radius:10px;padding:8px}


/* Kalimat phase 2: comment sorting, @mentions and richer notifications */
#commentTools{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}
#commentTools button{flex:1;min-width:90px;border:1px solid #17658b;border-radius:12px;padding:8px 6px;background:#061a2b;color:#9bdfff;font:inherit;font-size:12px}
#commentTools button.on{background:linear-gradient(135deg,#087acb,#13bdf2);color:#031321;border-color:#5be3ff}
.mention{color:#55dcff;font-weight:700}
#mentionHint{font-size:12px;color:#7dd3fc;margin:0 0 6px}
.nt{cursor:pointer;border-radius:12px;padding:12px 8px}
.nt.unread{background:linear-gradient(90deg,#082945aa,#06132266);border-inline-start:3px solid #20c7ff}
.nt.read{opacity:.78}
.nt .ntype{display:inline-block;font-size:10px;color:#55dcff;border:1px solid #17658b;border-radius:10px;padding:1px 6px;margin-inline-start:5px}


/* Profile social lists: tappable stats and people rows */
.stat-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;cursor:pointer;border-radius:12px;padding:8px 3px;outline-offset:2px}
.stat-item span{color:#8295a8}
.stat-link:active,.people-row:active{background:#0c2b40}
.people-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.people-help{color:#9ab6ca;line-height:1.8;font-size:13px;margin:4px 2px}
.people-status{display:block;color:#7dd3fc;line-height:1.8;margin:12px 2px}
.people-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px;border:1px solid #149bdf55;border-radius:14px;background:#061827;color:#eefaff;font:inherit;text-align:right;cursor:pointer}
.people-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#0f2a3a;border:1px solid #38bdf8;flex-shrink:0}
.people-meta{display:flex;flex:1;min-width:0;flex-direction:column;gap:3px}
.people-name{font-weight:700;overflow-wrap:anywhere}
.people-meta small{font-size:11px;color:#87b5cf}
.people-arrow{font-size:26px;color:#7dd3fc}


/* Kalimat: genuine video fullscreen, without the native iOS-style player detour */
video:fullscreen, video:-webkit-full-screen{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;object-fit:contain!important;background:#000!important}
.card:fullscreen,.card:-webkit-full-screen{width:100vw!important;height:100dvh!important;background:#000!important;overflow:hidden!important}
.card:fullscreen video,.card:-webkit-full-screen video{width:100%!important;height:100%!important;object-fit:contain!important}
.card:fullscreen .side,.card:fullscreen .info,.card:fullscreen .vcontrols,.card:-webkit-full-screen .side,.card:-webkit-full-screen .info{z-index:2147483000}
html:has(video:fullscreen) #feed,html:has(.card:fullscreen) #feed{scroll-snap-type:none!important;overflow:hidden!important}
#dCom{width:min(94vw,560px);max-width:94vw;padding:20px 18px 16px;border:1px solid #16435a;border-radius:22px;background:linear-gradient(180deg,#0b1d2a,#06111b 70%);color:#eaf7ff;box-shadow:0 18px 60px #000b}
#dCom::backdrop{background:#000b;backdrop-filter:blur(5px)}
#dCom h2{font-size:19px;margin:0 0 14px;font-weight:700;color:#f3fbff}
#dCom #cl{max-height:48vh;overflow-y:auto;overscroll-behavior:contain;padding:2px 1px 8px}
#dCom .cm{display:block;position:relative;margin:9px 0;padding:10px 13px 9px;border-radius:15px;background:#102534;border:0;box-shadow:none;word-break:break-word}
#dCom .cm.rp{margin-inline-start:24px;border-inline-start:2px solid #168fbd;border-radius:12px;background:#0a1c29}
#dCom .cb{display:block}
#dCom .cb b{display:block;color:#8edcff;font-size:13px;font-weight:700;margin-bottom:2px}
#dCom .cb .dt{display:block;color:#7894a8;font-size:10px;margin-bottom:5px}
#dCom .cb p{font-size:14px;line-height:1.75;color:#f0f6fa;margin:3px 0 6px;white-space:pre-wrap}
#dCom .ca{display:flex;gap:16px;align-items:center;margin-top:5px}
#dCom .ca button{font-size:12px;color:#91adbf;padding:3px 0}
#dCom .ca button.on{color:#42c8ff}
#dCom #ci{width:100%;margin-top:10px;background:#061522;color:#f2fbff;border:1px solid #1b5069;border-radius:18px;padding:12px 14px;font:inherit;outline:none}
#dCom #ci:focus{border-color:#20baf2;box-shadow:0 0 0 2px #20baf222}
#dCom #cs,#dCom #xCom{border-radius:14px;min-height:42px}
#dCom #commentTools{gap:6px;margin:7px 0 12px}
#dCom #commentTools button{border-radius:999px;padding:7px 9px;font-size:12px;min-width:0}
#dCom #mentionHint{color:#7898ac;font-size:11px;margin:6px 2px}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.10.4/lib/nostr.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const NT=window.NostrTools;
let RELAYS=["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net"];
try{const r=JSON.parse(localStorage.getItem("relays")||"null");if(Array.isArray(r)&&r.length)RELAYS=r.filter(u=>/^wss:\/\//.test(u))}catch{}
const BLOSSOM="https://blossom.primal.net";
const TAG="kalimat-app";let curTag=null;
const $=s=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);k.forEach(x=>e.append(x));return e};
const LOGO=document.querySelector("#logo").src;
const now=()=>Math.floor(Date.now()/1000);
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
let sk=null,pk=null,muted=!(()=>{try{return localStorage.getItem("snd")=="1"}catch{return false}})(),follows=new Set(),cLoaded=false,c3="",c3t=0,tab="all";
const seen=new Set(),subs={},handlers={},socks=[],profiles={},cnt={};
let oldestFeedTime=0,olderFeedCursor=0,olderFeedBusy=false;

/* ---------- relays ---------- */
function open1(u){
  const w=new WebSocket(u);
  w.onopen=()=>Object.values(subs).forEach(s=>w.send(s));
  w.onmessage=e=>{try{const m=JSON.parse(e.data);if(m[0]=="EVENT"&&handlers[m[1]])handlers[m[1]](m[2])}catch{}};
  w.onclose=()=>{const i=socks.indexOf(w);if(i>-1)socks.splice(i,1);setTimeout(()=>open1(u),6000)};
  socks.push(w);
}
function sub(id,filters,cb){
  subs[id]=JSON.stringify(["REQ",id,...filters]);handlers[id]=cb;
  socks.forEach(w=>w.readyState==1&&w.send(subs[id]));
}
function publish(ev){const m=JSON.stringify(["EVENT",ev]);socks.forEach(w=>w.readyState==1&&w.send(m))}

/* ---------- identity ---------- */
async function sign(t){
  if(sk)return NT.finalizeEvent(t,sk);
  if(window.nostr)return window.nostr.signEvent(t);
  throw new Error("سجّل الدخول بمفتاح أو بمحفظة أولاً");
}
function setKey(s){
  sk=s;pk=NT.getPublicKey(s);
  try{localStorage.setItem("nsec",NT.nip19.nsecEncode(s))}catch{}
  ui();
}
function logout(){sk=null;pk=null;try{localStorage.removeItem("nsec")}catch{}ui();renderLogin()}
function ui(){if(pk){loadContacts();wantProfile(pk);startDM();startNotes()}else{follows=new Set()}applyTab()}
function loadContacts(){
  cLoaded=false;
  sub("c3",[{kinds:[3],authors:[pk],limit:1}],e=>{if(e.created_at<c3t)return;c3t=e.created_at;c3=e.content;follows=new Set(e.tags.filter(t=>t[0]=="p").map(t=>t[1]));cLoaded=true;applyTab()});
  setTimeout(()=>{cLoaded=true},5000);
}
function ok(){if(pk)return true;renderLogin();$("#dLogin").showModal();return false}

function renderLogin(){

let selectedMediaBytes=null, selectedMediaFile=null, selectedMediaError="";
async function snapshotSelectedFile(file){
  selectedMediaBytes=null;selectedMediaFile=file;selectedMediaError="";
  if(!file)return;
  try{
    // Read while the Android document-picker grant is fresh, not later on Publish.
    const buffer=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(reader.error||new Error("تعذرت قراءة الملف من الهاتف"));
      reader.onabort=()=>reject(new Error("أُلغيت قراءة الملف"));
      reader.readAsArrayBuffer(file);
    });
    selectedMediaBytes=buffer;
  }catch(e){selectedMediaError="تعذرت قراءة الملف من الهاتف. أعد اختياره من المعرض وانتظر اكتمال المعاينة ثم اضغط نشر.";}
}
async function upload(file){
  if(!file)throw new Error("لم يتم اختيار ملف");
  if(selectedMediaFile!==file||!selectedMediaBytes)await snapshotSelectedFile(file);
  if(!selectedMediaBytes)throw new Error(selectedMediaError||"تعذرت قراءة الملف؛ أعد اختياره من المعرض ثم انتظر المعاينة");
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  const guessedType=file.type||({jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",avif:"image/avif",bmp:"image/bmp",mp4:"video/mp4",m4v:"video/mp4",mov:"video/quicktime",webm:"video/webm",ogv:"video/ogg",m3u8:"application/x-mpegURL"}[ext]||"");
  if(!/^image\//.test(guessedType)&&!/^video\//.test(guessedType)&&guessedType!="application/x-mpegURL")throw new Error("تعذّر تحديد نوع الملف؛ اختر صورة أو فيديو بصيغة معروفة");
  if(file.size>200*1024*1024)throw new Error("حجم الملف أكبر من 200 ميغابايت");
  if(!crypto.subtle)throw new Error("المتصفح لا يدعم التحقق الآمن المطلوب لرفع الملفات؛ افتح المنصة في Chrome");
  const bytes=selectedMediaBytes;
  const h=hex(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)));
  const auth=await sign({kind:24242,created_at:now(),content:"Upload file to Blossom",tags:[["t","upload"],["x",h],["expiration",String(now()+600)]]});
  const token=btoa(unescape(encodeURIComponent(JSON.stringify(auth))));
  let response;
  try{
    response=await fetch(BLOSSOM+"/upload",{method:"PUT",headers:{Authorization:"Nostr "+token,"Content-Type":guessedType},body:new Blob([bytes],{type:guessedType})});
  }catch(e){throw new Error("تعذّر الاتصال بخدمة رفع الوسائط. تحقق من الإنترنت أو جرّب لاحقاً.")}
  if(!response.ok){let detail="";try{detail=(await response.text()).slice(0,180)}catch{};throw new Error("رفض خادم رفع الوسائط الملف ("+response.status+"). "+detail)}
  let data;try{data=await response.json()}catch{throw new Error("خادم الرفع لم يُرجع رابط الملف")}
  const url=data.url||data.sha256&&(`${BLOSSOM}/${data.sha256}`);

  return url;
}

function tagsForMentions(text, exclude=[]){
  const tags=[],seen=new Set(exclude);
  const candidates=mentionCandidates().sort((a,b)=>b.name.length-a.name.length);
  for(const u of candidates){
    if(!u.name||seen.has(u.pub))continue;
    const escaped=u.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    const re=new RegExp("(^|[^\\p{L}\\p{N}_])@"+escaped+"(?=$|[^\\p{L}\\p{N}_])","iu");
    if(re.test(text)){tags.push(["p",u.pub]);seen.add(u.pub)}

  // Allow a direct @npub1... mention when a valid Nostr public key encoding is supplied.
  for(const m of text.matchAll(/@((?:npub1)[a-z0-9]{20,})/giu)){
    try{const pub=NT.nip19.decode(m[1]).data;if(typeof pub==="string"&&!seen.has(pub)){tags.push(["p",pub]);seen.add(pub)}}catch{}
  }
  return tags;
}
